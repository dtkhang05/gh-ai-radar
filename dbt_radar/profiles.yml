radar:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ../data/radar_dbt.duckdb
      threads: 2
      # shared machine (another project runs Docker): cap resources so one model cannot exhaust RAM or disk
      settings:
        memory_limit: 3GB
        max_temp_directory_size: 5GB
        # temp_directory is left at DuckDB's default (<db file>.tmp, inside data/): setting it per connection fails with
        # "Cannot switch temporary directory after the current one has been used" when a thread opens a cursor after another one spilled.
